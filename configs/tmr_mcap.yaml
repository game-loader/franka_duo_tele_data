# Default competition-site capture contract.
#
# The recorder hard-fixes rosbag2 storage to MCAP and the storage preset to
# zstd_fast. Neither setting is configurable from this file. Every listed ROS
# camera/gripper/TF message is serialized directly by rosbag2. The eight arm
# streams below are the only exception: an automatically supervised relay caps
# them at 100 Hz before rosbag2 records the relay destinations. There is still
# no image decoding, synchronization, action/state aggregation, or conversion.
dataset_name: franka_duo_tmr_raw
output_root: datasets/franka_duo_mcap
max_episodes: 100

# Explicit source -> recorded relay contract for the eight arm streams. On
# each 10 ms tick the relay publishes only the newest message not published on
# an earlier tick; it never duplicates a stale sample.
arm_sampling:
  rate_hz: 100
  routes:
    - source_topic: /left/franka_robot_state_broadcaster/current_pose
      recorded_topic: /franka_duo_tele_data/rate100/left/franka_robot_state_broadcaster/current_pose
    - source_topic: /left/franka_robot_state_broadcaster/desired_joint_states
      recorded_topic: /franka_duo_tele_data/rate100/left/franka_robot_state_broadcaster/desired_joint_states
    - source_topic: /left/franka_robot_state_broadcaster/measured_joint_states
      recorded_topic: /franka_duo_tele_data/rate100/left/franka_robot_state_broadcaster/measured_joint_states
    - source_topic: /left/franka_robot_state_broadcaster/desired_end_effector_twist
      recorded_topic: /franka_duo_tele_data/rate100/left/franka_robot_state_broadcaster/desired_end_effector_twist
    - source_topic: /right/franka_robot_state_broadcaster/current_pose
      recorded_topic: /franka_duo_tele_data/rate100/right/franka_robot_state_broadcaster/current_pose
    - source_topic: /right/franka_robot_state_broadcaster/desired_joint_states
      recorded_topic: /franka_duo_tele_data/rate100/right/franka_robot_state_broadcaster/desired_joint_states
    - source_topic: /right/franka_robot_state_broadcaster/measured_joint_states
      recorded_topic: /franka_duo_tele_data/rate100/right/franka_robot_state_broadcaster/measured_joint_states
    - source_topic: /right/franka_robot_state_broadcaster/desired_end_effector_twist
      recorded_topic: /franka_duo_tele_data/rate100/right/franka_robot_state_broadcaster/desired_end_effector_twist

mcap:
  # Normal recording is reward-free; run_manual_recorder.sh overrides this to
  # true. rosbag2 stops before prompting; reward is stored in the sidecar
  # manifest and no reward-entry delay is captured in the MCAP.
  rewarded: false
  event_topic: /franka_duo_tele_data/episode_event
  startup_timeout_s: 15.0
  metadata_publish_timeout_s: 15.0
  shutdown_timeout_s: 30.0

  topics:
    # Record only relay destinations for arm data. Never add the eight source
    # topics here, or the intended 100 Hz storage cap would be bypassed.
    - /franka_duo_tele_data/rate100/left/franka_robot_state_broadcaster/current_pose
    - /franka_duo_tele_data/rate100/left/franka_robot_state_broadcaster/desired_joint_states
    - /franka_duo_tele_data/rate100/left/franka_robot_state_broadcaster/measured_joint_states
    - /franka_duo_tele_data/rate100/left/franka_robot_state_broadcaster/desired_end_effector_twist
    - /franka_duo_tele_data/rate100/right/franka_robot_state_broadcaster/current_pose
    - /franka_duo_tele_data/rate100/right/franka_robot_state_broadcaster/desired_joint_states
    - /franka_duo_tele_data/rate100/right/franka_robot_state_broadcaster/measured_joint_states
    - /franka_duo_tele_data/rate100/right/franka_robot_state_broadcaster/desired_end_effector_twist

    # Headerless target fractions and measured Robotiq JointState streams.
    - /left/gripper/gripper_client/target_gripper_width_percent
    - /right/gripper/gripper_client/target_gripper_width_percent
    - /left/gripper/joint_states
    - /right/gripper/joint_states

    # ZED-M rectified RGB, registered depth, and matching RGB intrinsics.
    - /head_camera/zed/rgb/color/rect/image
    - /head_camera/zed/depth/depth_registered
    - /head_camera/zed/rgb/color/rect/camera_info

    # Dual D405 color only. D405 depth topics are intentionally excluded.
    - /wrist_camera_left/color/image_raw
    - /wrist_camera_left/color/camera_info
    - /wrist_camera_right/color/image_raw
    - /wrist_camera_right/color/camera_info

    # Retain available transforms for offline frame reconstruction. Their
    # presence does not guarantee a complete/calibrated head-to-base TF tree;
    # inspect the bag and use calibrated static extrinsics when it is absent.
    - /tf
    - /tf_static
