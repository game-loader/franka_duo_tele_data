franka_duo_policy_action_relay:
  ros__parameters:
    input_topic: /franka_duo/policy_action
    left_pose_topic: /franka_duo/policy/left/target_pose
    right_pose_topic: /franka_duo/policy/right/target_pose
    left_gripper_topic: /left/gripper/gripper_client/target_gripper_width_percent
    right_gripper_topic: /right/gripper/gripper_client/target_gripper_width_percent
    left_arm_frame: left_fr3v2_link0
    right_arm_frame: right_fr3v2_link0
    enable_robot: false
    enable_gripper: false

/**:
  controller_manager:
    ros__parameters:
      left_policy_cartesian_pose_controller:
        type: franka_duo_policy_control/PolicyCartesianPoseController
      right_policy_cartesian_pose_controller:
        type: franka_duo_policy_control/PolicyCartesianPoseController
  left_policy_cartesian_pose_controller:
    ros__parameters:
      type: franka_duo_policy_control/PolicyCartesianPoseController
      arm_prefix: left
      target_topic: /franka_duo/policy/left/target_pose
      expected_frame_id: left_fr3v2_link0
      allow_motion: true
      linear_kp: 16.0
      linear_kd: 8.0
      linear_max_velocity: 0.1
      linear_max_acceleration: 0.1
      linear_max_jerk: 1.0
      angular_kp: 16.0
      angular_kd: 8.0
      angular_max_velocity: 1.5
      angular_max_acceleration: 5.0
      angular_max_jerk: 50.0
  right_policy_cartesian_pose_controller:
    ros__parameters:
      type: franka_duo_policy_control/PolicyCartesianPoseController
      arm_prefix: right
      target_topic: /franka_duo/policy/right/target_pose
